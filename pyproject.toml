[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-fleet"
version = "2.0.0"
description = "Nexus Fleet Model — AI bot fleet orchestration framework"
requires-python = ">=3.12"
dependencies = [
    "redis[hiredis]>=5.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "discord.py>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fakeredis>=2.21",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/nexus/tests"]
asyncio_mode = "auto"
