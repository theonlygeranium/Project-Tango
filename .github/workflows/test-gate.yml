name: Sentinel Test Gate

on:
  pull_request:
    branches: [main]

jobs:
  sentinel-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install redis pyyaml pydantic pytest pytest-asyncio fakeredis

      - name: Run Sentinel enforcement check
        env:
          PYTHONPATH: src
        run: python -m nexus.testing.enforcement --check-commit

      - name: Run Sentinel test suite
        env:
          PYTHONPATH: src
        run: python -m pytest src/nexus/tests/testing/ -v --tb=short
